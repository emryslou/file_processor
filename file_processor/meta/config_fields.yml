version: 1.0.0
config:
  keys:
    - key: 'version'
      type: str
      description: 配置版本
      required: true
      example: "1.0.0"
      default: "1.0.0"
      fixed: true
      validator:
        type: 'version'
    - key: 'app'
      type: dict
      description: 应用配置
      required: true
      keys:
        - key: 'stores'
          parent: 'app'
          type: list[store]
          description: 存储配置列表
          required: true
        - key: 'processors'
          parent: 'app'
          type: list[processor]
          description: 处理器配置列表
          required: true
        - key: 'logger'
          parent: 'app'
          type: dict
          description: 日志配置
          required: true
          keys:
          - key: 'level'
            parent: 'app.logger'
            type: str
            description: 日志级别
            required: true
            example: "INFO"
            default: "INFO"
            choices: ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"]
          - key: 'format'
            parent: 'app.logger'
            type: str
            description: 日志格式
            required: true
            example: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
            default: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
          - key: 'file'
            parent: 'app.logger'
            type: str
            description: 日志文件路径
            required: true
            example: "app.log"
            default: "app.log"
          - key: 'console'
            parent: 'app.logger'
            type: bool
            description: 是否输出到控制台
            required: true
            example: true
            default: true
          - key: 'rotation'
            parent: 'app.logger'
            type: str
            description: 日志文件滚动策略
            required: true
            example: "10MB"
            default: "10MB"
      - key: 'notification'
        parent: 'app'
        type: list[notification]
        description: 通知配置
        required: false
  objects:
  - type: 'notification.email'
    keys:
      - key: 'type'
        type: str
        description: 通知类型
        required: true
        example: "email"
        default: "email"
        fixed: true
      - key: 'to'
        type: list[str]
        description: 接收通知的邮箱列表
        required: true
        example: ["user@example.com"]
        default: []
  - type: 'processor.dram'
  - type: 'processor.logic'
  - type: 'store.ftp'
  - type: 'store.ftps'
  - type: 'store.sftp'
  - type: 'store.local'